[project]
name = "leagal-ai"
version = "0.1.0"
description = "Simple tool to read agreements and find risky points"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "streamlit>=1.35.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langgraph>=0.1.0",
    "chromadb>=0.5.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]
